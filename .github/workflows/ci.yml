name: CI

on:
  push:
    branches: [develop, feature/ci-pipeline]
  pull_request:
    branches: [develop]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show what we got
        run: |
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          node -v
          ls -la
